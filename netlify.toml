# build estático + função agendada. Variáveis de ambiente: no painel Netlify, não aqui.
[build]
  command   = "node build.js"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# cron: publica os 'scheduled' vencidos; o trigger da BD dispara o build a seguir
[functions."publish-scheduled"]
  schedule = "@hourly"
