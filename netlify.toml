# PR Studio — prstudio.ch
#
# O build gera dist/ com uma pasta por idioma (/de/, /fr/, /it/, /en/; o
# português fica na raiz), cada uma com o seu canonical e o conjunto
# completo de hreflang. Ver build.js.
#
# Não há dependências: o script corre só com Node, sem npm install.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
