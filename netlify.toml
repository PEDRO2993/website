# build estático + função agendada. Variáveis de ambiente: no painel Netlify, não aqui.
[build]
  command   = "node build.js"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# cron: publica os 'scheduled' vencidos; o trigger da BD dispara o build a seguir
[functions."publish-scheduled"]
  schedule = "@hourly"

# escritor automático: 1 artigo por dia (06:00 UTC) em 5 idiomas — tema da fila ou tema automático.
# O gatilho chama autopilot-writer-background (função de fundo, até 15 min). Precisa de ANTHROPIC_API_KEY.
[functions."autopilot-writer"]
  schedule = "0 6 * * *"
